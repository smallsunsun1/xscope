[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xscope-runtime"
version = "0.1.0"
description = "XScope development model runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
  "prometheus-client==0.23.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
xscope-runtime = "xscope_runtime.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/xscope_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
