[workspace]
members = [
    "crates/domain",
    "crates/entities",
    "crates/migration",
    "crates/telemetry",
    "crates/gateway",
    "crates/control-plane",
    "crates/kubernetes",
    "crates/cluster-agent",
    "crates/operator",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = { version = "1", features = ["backtrace"] }
arc-swap = "1.9.2"
axum = "0.8.9"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2.1"
getrandom = "0.3"
http = "1"
nix = { version = "0.29", features = ["fs"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube-leader-election = "0.44"
futures = "0.3"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"] }
prometheus = { version = "0.14", default-features = false }
tracing-opentelemetry = "0.32"
pingora-core = { version = "0.8.1", features = ["rustls"] }
pingora-error = "0.8.1"
pingora-http = "0.8.1"
pingora-load-balancing = "0.8.1"
pingora-proxy = { version = "0.8.1", features = ["rustls"] }
redis = { version = "1.6.0", features = ["script"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["macros", "postgres-array", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tiktoken-rs = "0.12.0"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
sse-core = { version = "0.2.3", default-features = false, features = ["std"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "fs", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
expect_used = "deny"
unwrap_used = "deny"
