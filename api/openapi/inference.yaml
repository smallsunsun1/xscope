openapi: 3.1.0
info:
  title: XScope OpenAI-compatible Inference API
  version: 0.1.0
  description: Development non-streaming chat-completions contract.
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: A completed assistant response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { enum: [system, user, assistant] }
        content: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1 }
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Message" }
        stream: { const: false, default: false }
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message: { $ref: "#/components/schemas/Message" }
              finish_reason: { type: string }
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
