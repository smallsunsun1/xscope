apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-ingress
  namespace: xscope-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - { protocol: TCP, port: 8081 }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { protocol: TCP, port: 8084 }
---
