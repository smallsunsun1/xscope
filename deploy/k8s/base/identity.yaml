apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: xscope
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: xscope }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: postgres-password }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, value: "http://xscope.localhost:30080" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: keycloak-admin-password }
            - name: XSCOPE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: oauth-client-secret }
            - name: XSCOPE_BOOTSTRAP_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: bootstrap-user-password }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: 750m, memory: 768Mi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: xscope-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: xscope-system
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/component: console-auth
        app.kubernetes.io/part-of: xscope
    spec:
      # Docker Desktop resolves its host gateway at this address. Browsers
      # resolve *.localhost to loopback, so both sides can use one OIDC issuer.
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["xscope.localhost"]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --provider-display-name=XScope
            - --oidc-issuer-url=http://xscope.localhost:30080/realms/xscope
            - --redirect-url=http://localhost:30081/oauth2/callback
            - --email-domain=*
            - --scope=openid profile email
            - --code-challenge-method=S256
            - --upstream=http://control-plane:8081/
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=true
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --reverse-proxy=true
          env:
            - { name: OAUTH2_PROXY_CLIENT_ID, value: xscope-console }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: oauth-client-secret }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: { name: xscope-platform-secrets, key: oauth-cookie-secret }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: xscope-system
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - { name: http, port: 80, targetPort: http }
