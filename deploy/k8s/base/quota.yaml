apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: xscope-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: xscope
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: quota
        app.kubernetes.io/part-of: xscope
    spec:
      containers:
        - name: redis
          image: redis:8.4.6-alpine
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
          resources:
            requests: { cpu: 10m, memory: 40Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
