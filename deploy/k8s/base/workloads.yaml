apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: control-plane }
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-plane, app.kubernetes.io/part-of: xscope }
    spec:
      serviceAccountName: xscope-control-plane
      containers:
        - name: control-plane
          image: xscope/control-plane:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: xscope-config } }]
          ports: [{ name: http, containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 300m, memory: 192Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: xscope }
    spec:
      securityContext: { fsGroup: 65532 }
      containers:
        - name: gateway
          image: xscope/gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: xscope-config } }]
          env:
            - name: XSCOPE_API_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: xscope-gateway-keys
                  key: keys.json
                  optional: true
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: usage-wal, mountPath: /var/lib/xscope/usage-wal }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 500m, memory: 192Mi }
      volumes:
        - name: usage-wal
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: runtime }
  template:
    metadata:
      labels: { app.kubernetes.io/name: runtime, app.kubernetes.io/part-of: xscope }
    spec:
      containers:
        - name: runtime
          image: xscope/runtime:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: xscope-config } }]
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: xscope-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: operator, app.kubernetes.io/part-of: xscope }
    spec:
      serviceAccountName: xscope-operator
      containers:
        - name: operator
          image: xscope/operator:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: xscope-config } }]
          ports: [{ name: health, containerPort: 8082 }]
          readinessProbe: { httpGet: { path: /readyz, port: health } }
          livenessProbe: { httpGet: { path: /healthz, port: health } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 250m, memory: 160Mi }
