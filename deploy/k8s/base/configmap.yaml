apiVersion: v1
kind: ConfigMap
metadata:
  name: xscope-config
  namespace: xscope-system
data:
  XSCOPE_CONTROL_ADDRESS: "0.0.0.0:8081"
  XSCOPE_CONTROL_INTERNAL_ADDRESS: "0.0.0.0:8084"
  XSCOPE_CONSOLE_AUTH: "trusted-headers"
  XSCOPE_CONSOLE_DIR: "/srv/console"
  XSCOPE_DEFAULT_TENANT_ID: "tenant-local"
  XSCOPE_AUTO_JOIN_DEFAULT_TENANT: "false"
  XSCOPE_BOOTSTRAP_ADMIN_USERS: "platform-admin"
  XSCOPE_CLUSTER_ID: "docker-desktop"
  XSCOPE_CLUSTER_AGENT_ADDRESS: "0.0.0.0:8083"
  XSCOPE_CLUSTER_AGENT_URL: "http://cluster-agent:8083"
  XSCOPE_GATEWAY_ADDRESS: "0.0.0.0:8080"
  XSCOPE_CONTROL_INTERNAL_URL: "http://control-plane:8084/internal/v1"
  XSCOPE_POLICY_REFRESH_SECONDS: "5"
  XSCOPE_REDIS_URL: "redis://redis:6379/"
  RUST_LOG: "xscope_gateway=info,xscope_control_plane=info,xscope_kubernetes=info,xscope_cluster_agent=info,xscope_operator=info,xscope_telemetry=info,opentelemetry=warn,kube=warn,tower_http=info,sea_orm=warn,pingora=warn"
  RUST_LIB_BACKTRACE: "1"
  XSCOPE_METRICS_ADDRESS: "0.0.0.0:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_BSP_MAX_QUEUE_SIZE: "1024"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "128"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=local,k8s.cluster.name=docker-desktop"
  XSCOPE_LOG_FORMAT: "json"
  XSCOPE_SERVING_ENTRY_JSON: '{"id":"demo-pool","model":"xscope-demo","address":"inference-serving:8085"}'
  XSCOPE_USAGE_WAL: "/var/lib/xscope/usage-wal/events.jsonl"
  # Combined intent + usage data, including retained sealed segments (256 MiB PVC).
  XSCOPE_WAL_SEGMENT_BYTES: "16777216"
  XSCOPE_WAL_MAX_BYTES: "201326592"
  XSCOPE_WAL_MIN_FREE_BYTES: "33554432"
  XSCOPE_REGION: "local"
  XSCOPE_MODEL_REVISION: "development"
  XSCOPE_PRICE_VERSION: "2026-09-01"
  XSCOPE_RUNTIME_HOST: "0.0.0.0"
  XSCOPE_RUNTIME_PORT: "8090"
  XSCOPE_OPERATOR_ADDRESS: "0.0.0.0:8082"
  XSCOPE_GATEWAY_HEALTH_URL: "http://gateway:80/healthz"
  XSCOPE_RUNTIME_HEALTH_URL: "http://runtime:8090/healthz"
  XSCOPE_OPERATOR_HEALTH_URL: "http://operator:8082/healthz"
