apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: xscope-system
spec:
  selector: { app.kubernetes.io/name: control-plane }
  ports:
    - { name: http, port: 8081, targetPort: http }
    - { name: internal, port: 8084, targetPort: internal }
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-agent
  namespace: xscope-system
spec:
  selector: { app.kubernetes.io/name: cluster-agent }
  ports: [{ name: http, port: 8083, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: xscope-system
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: xscope-system
spec:
  selector: { app.kubernetes.io/name: runtime }
  ports: [{ name: http, port: 8090, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: xscope-system
spec:
  selector: { app.kubernetes.io/name: operator }
  ports: [{ name: http, port: 8082, targetPort: health }]
