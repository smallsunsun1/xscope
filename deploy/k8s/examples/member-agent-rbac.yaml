# Example names only. Bind the member ServiceAccount in the managed namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xscope-member-agent
  namespace: synthetic-member
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [inference.networking.k8s.io]
    resources: [inferencepools]
    verbs: [get]
  - apiGroups: [platform.xscope.io]
    resources: [modeldeployments]
    verbs: [get, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xscope-member-agent
  namespace: synthetic-member
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xscope-member-agent
subjects:
  - kind: ServiceAccount
    name: xscope-member-agent
    namespace: synthetic-member
