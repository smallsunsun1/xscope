apiVersion: v1
kind: ServiceAccount
metadata: { name: xscope-prometheus, namespace: xscope-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: xscope-prometheus, namespace: xscope-system }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: xscope-prometheus, namespace: xscope-system }
subjects:
  - { kind: ServiceAccount, name: xscope-prometheus, namespace: xscope-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: xscope-prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: xscope-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: xscope }
    spec:
      serviceAccountName: xscope-prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=256MB
            - --query.max-concurrency=4
            - --query.timeout=15s
          env: [{ name: GOMAXPROCS, value: "1" }]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: xscope-prometheus }
        - name: data
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: xscope-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: xscope }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.10.0@sha256:8c593d8048d86334eb52dba26633b6c846b8ecbe5c22905702c932ae97baeb42
          args: [--config=/etc/jaeger/jaeger.yaml]
          env: [{ name: GOMAXPROCS, value: "1" }]
          ports:
            - { name: http, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe: { tcpSocket: { port: http } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger, readOnly: true }
      volumes:
        - name: config
          configMap: { name: xscope-jaeger }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: xscope-system }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: xscope-system }
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: http, port: 16686, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: xscope-metrics-ingress, namespace: xscope-system }
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [gateway, control-plane, runtime, cluster-agent, operator, inference-serving]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ port: 9090, protocol: TCP }, { port: 19001, protocol: TCP }]
---
# Keep the public gateway API reachable after adding an ingress policy for metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-public-ingress, namespace: xscope-system }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: telemetry-backend-ingress, namespace: xscope-system }
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [jaeger, prometheus]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: xscope }
      ports: [{ port: 4317, protocol: TCP }, { port: 4318, protocol: TCP }]
