apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: xscope-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: xscope }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GOMAXPROCS, value: "1" }
            - { name: GOMEMLIMIT, value: 512MiB }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_DATABASE_WAL, value: "true" }
            - { name: GF_LOG_MODE, value: console }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: xscope-grafana, key: admin-user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: xscope-grafana, key: admin-password }
            - name: GF_SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: xscope-grafana, key: secret-key }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            limits: { cpu: 300m, memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/xscope-dashboards, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: datasources
          configMap: { name: xscope-grafana-datasources }
        - name: provider
          configMap: { name: xscope-grafana-provider }
        - name: dashboards
          configMap: { name: xscope-grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: xscope-system }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
# Private by default; the local overlay explicitly allows the authenticated NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: grafana-private-ingress, namespace: xscope-system }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Ingress]
  ingress: []
