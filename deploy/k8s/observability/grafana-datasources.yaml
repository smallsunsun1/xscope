apiVersion: 1
datasources:
  - name: Prometheus
    uid: xscope-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData: { httpMethod: POST, timeInterval: 30s }
  - name: Jaeger
    uid: xscope-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    version: 1
