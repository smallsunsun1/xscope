# Embedded Badger persists traces without another database service (single replica only).
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: { level: warn }
extensions:
  jaeger_query:
    storage: { traces: local }
    http: { endpoint: 0.0.0.0:16686 }
  jaeger_storage:
    backends:
      local:
        badger:
          directories:
            keys: /var/lib/jaeger/keys
            values: /var/lib/jaeger/values
          ephemeral: false
          consistency: true
          ttl: { spans: 72h }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 64
  batch:
    send_batch_size: 128
    send_batch_max_size: 256
    timeout: 1s
exporters:
  jaeger_storage_exporter: { trace_storage: local }
