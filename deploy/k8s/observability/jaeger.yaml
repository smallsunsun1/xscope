# Jaeger v2 embeds the OpenTelemetry Collector. Local traces are intentionally ephemeral.
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: { level: warn }
extensions:
  jaeger_query:
    storage: { traces: local }
    http: { endpoint: 0.0.0.0:16686 }
  jaeger_storage:
    backends:
      local:
        memory: { max_traces: 1000 }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  batch:
    send_batch_size: 128
    send_batch_max_size: 256
    timeout: 1s
exporters:
  jaeger_storage_exporter: { trace_storage: local }
