apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - resources.yaml
  - grafana.yaml
configMapGenerator:
  - name: xscope-prometheus
    namespace: xscope-system
    files: [prometheus.yaml, alerts.yaml]
  - name: xscope-jaeger
    namespace: xscope-system
    files: [jaeger.yaml]
  - name: xscope-grafana-datasources
    namespace: xscope-system
    files: [datasources.yaml=grafana-datasources.yaml]
  - name: xscope-grafana-provider
    namespace: xscope-system
    files: [dashboards.yaml=grafana-provider.yaml]
  - name: xscope-grafana-dashboards
    namespace: xscope-system
    files: [xscope-overview.json=grafana-dashboard.json, xscope-traces.json=grafana-traces.json]
