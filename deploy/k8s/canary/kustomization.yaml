apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: xscope-system
resources:
  - ../serving
nameSuffix: -canary
patches:
  - target: { kind: Deployment, name: inference-serving }
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: inference-serving-canary
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: inference-serving-canary
      - op: replace
        path: /spec/template/spec/containers/1/args/0
        value: --pool-name=demo-pool-canary
  - target: { kind: Service, name: inference-serving }
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: inference-serving-canary
  - target: { kind: NetworkPolicy }
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/app.kubernetes.io~1name
        value: inference-serving-canary
  - target: { kind: InferencePool, name: demo-pool }
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: runtime-canary
      - op: replace
        path: /spec/endpointPickerRef/name
        value: inference-serving-canary
