apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modeldeployments.platform.xscope.io
spec:
  group: platform.xscope.io
  scope: Namespaced
  names:
    plural: modeldeployments
    singular: modeldeployment
    kind: ModelDeployment
    shortNames: [mdp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.id
        - name: Revision
          type: string
          jsonPath: .spec.model.revision
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [model, runtime, replicas, resources]
              properties:
                model:
                  type: object
                  required: [id, revision, uri, checksum]
                  properties:
                    id: { type: string, minLength: 1 }
                    revision: { type: string, minLength: 1 }
                    uri: { type: string, minLength: 1 }
                    checksum: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
                runtime:
                  type: object
                  required: [image, protocol]
                  properties:
                    image: { type: string }
                    protocol: { type: string, enum: [openai, triton-grpc, custom-http] }
                    port: { type: integer, minimum: 1, maximum: 65535, default: 8000 }
                    arguments:
                      type: array
                      items: { type: string }
                replicas: { type: integer, minimum: 0, default: 1 }
                resources:
                  type: object
                  required: [limits]
                  properties:
                    limits:
                      type: object
                      additionalProperties: { type: string }
                    requests:
                      type: object
                      additionalProperties: { type: string }
                autoscaling:
                  type: object
                  properties:
                    minReplicas: { type: integer, minimum: 0 }
                    maxReplicas: { type: integer, minimum: 1 }
                    targetPendingRequests: { type: integer, minimum: 1 }
                rollout:
                  type: object
                  properties:
                    strategy: { type: string, enum: [rolling, canary, blueGreen], default: rolling }
                    canaryWeight: { type: integer, minimum: 0, maximum: 100 }
                nodeSelector:
                  type: object
                  additionalProperties: { type: string }
                tolerations:
                  type: array
                  x-kubernetes-preserve-unknown-fields: true
                  items: { type: object }
            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                readyReplicas: { type: integer }
                endpoint: { type: string }
                clusterId: { type: string }
                region: { type: string }
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", Unknown] }
                      observedGeneration: { type: integer }
                      lastTransitionTime: { type: string, format: date-time }
                      reason: { type: string }
                      message: { type: string }
