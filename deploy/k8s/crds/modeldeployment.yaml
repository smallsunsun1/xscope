apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modeldeployments.platform.xscope.io
spec:
  group: platform.xscope.io
  scope: Namespaced
  names:
    plural: modeldeployments
    singular: modeldeployment
    kind: ModelDeployment
    shortNames: [mdp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .status.selector
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.id
        - name: Revision
          type: string
          jsonPath: .spec.model.revision
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$') && size(self.metadata.name) <= 63"
              message: ModelDeployment name must be a Service DNS label, at most 63 characters.
          properties:
            spec:
              type: object
              required: [model, runtime, replicas, resources]
              x-kubernetes-validations:
                - rule: "!has(self.autoscaling) || (self.replicas >= self.autoscaling.minReplicas && self.replicas <= self.autoscaling.maxReplicas)"
                  message: Autoscaled replicas must stay within minReplicas and maxReplicas; scale-to-zero is not enabled.
                - rule: "!has(self.serving) || self.runtime.protocol == 'openai'"
                  message: InferencePool serving currently requires the OpenAI runtime protocol.
                - rule: "!has(self.autoscaling) || ((has(self.autoscaling.targetPendingRequests) || has(self.autoscaling.targetRunningRequests)) && !has(self.autoscaling.targetCpuUtilizationPercentage)) || (has(self.resources.requests) && 'cpu' in self.resources.requests)"
                  message: CPU autoscaling requires resources.requests.cpu; Kubernetes validates workload quantities.
                - rule: "!has(self.autoscaling) || (!has(self.autoscaling.targetPendingRequests) && !has(self.autoscaling.targetRunningRequests)) || has(self.serving)"
                  message: EPP autoscaling requires a pool-specific serving entry.
              properties:
                model:
                  type: object
                  required: [id, revision, uri, checksum]
                  properties:
                    id: { type: string, minLength: 1 }
                    revision: { type: string, minLength: 1 }
                    uri: { type: string, minLength: 1 }
                    checksum: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
                runtime:
                  type: object
                  required: [image, protocol]
                  properties:
                    image: { type: string }
                    protocol: { type: string, enum: [openai, triton-grpc, custom-http] }
                    port: { type: integer, minimum: 1, maximum: 65535, default: 8000 }
                    arguments:
                      type: array
                      items: { type: string }
                replicas: { type: integer, minimum: 0, default: 1 }
                resources:
                  type: object
                  required: [limits]
                  properties:
                    limits:
                      type: object
                      additionalProperties: { type: string }
                    requests:
                      type: object
                      maxProperties: 64
                      additionalProperties: { type: string, maxLength: 64 }
                autoscaling:
                  type: object
                  required: [maxReplicas]
                  x-kubernetes-validations:
                    - rule: self.maxReplicas >= self.minReplicas
                      message: maxReplicas must be at least minReplicas.
                  properties:
                    minReplicas: { type: integer, minimum: 1, default: 1 }
                    maxReplicas: { type: integer, minimum: 1 }
                    targetPendingRequests: { type: integer, minimum: 1 }
                    targetRunningRequests: { type: integer, minimum: 1 }
                    targetCpuUtilizationPercentage: { type: integer, minimum: 1, maximum: 100 }
                disruptionBudget:
                  type: object
                  required: [maxUnavailable]
                  properties:
                    maxUnavailable: { type: integer, minimum: 0 }
                serving:
                  type: object
                  required: [endpointPickerService]
                  properties:
                    endpointPickerService:
                      type: string
                      maxLength: 63
                      pattern: "^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$"
                    endpointPickerPort: { type: integer, minimum: 1, maximum: 65535, default: 9002 }
                rollout:
                  type: object
                  properties:
                    strategy:
                      type: string
                      enum: [rolling]
                      default: rolling
                      description: Workload rollout only. Version traffic is managed by project RoutePolicy.
                    canaryWeight: { type: integer, minimum: 0, maximum: 0, description: Deprecated; use RoutePolicy for traffic splitting. }
                nodeSelector:
                  type: object
                  additionalProperties: { type: string }
                tolerations:
                  type: array
                  x-kubernetes-preserve-unknown-fields: true
                  items: { type: object }
            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                readyReplicas: { type: integer }
                replicas: { type: integer }
                selector: { type: string }
                inferencePool: { type: string }
                endpointPickerService: { type: string }
                endpoint: { type: string }
                clusterId: { type: string }
                region: { type: string }
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", Unknown] }
                      observedGeneration: { type: integer }
                      lastTransitionTime: { type: string, format: date-time }
                      reason: { type: string }
                      message: { type: string }
