# NodePort traffic is allowed only for Grafana HTTP, never Prometheus/Jaeger.
# NodePort is not a loopback-only guarantee: keep this in local dev only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: grafana-private-ingress, namespace: xscope-system }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 3000, protocol: TCP }]
