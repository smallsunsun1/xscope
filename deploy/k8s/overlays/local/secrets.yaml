# Development-only credentials for the Docker Desktop overlay. Replace every
# value before using this overlay outside a local workstation.
apiVersion: v1
kind: Secret
metadata:
  name: xscope-platform-secrets
  namespace: xscope-system
type: Opaque
stringData:
  postgres-password: xscope-local-postgres
  keycloak-admin-password: xscope-local-keycloak-admin
  bootstrap-user-password: xscope-local-admin
  oauth-client-secret: xscope-local-oauth-client-secret
  oauth-cookie-secret: xscope-local-cookie-secret-32byt
---
apiVersion: v1
kind: Secret
metadata:
  name: xscope-gateway-keys
  namespace: xscope-system
type: Opaque
stringData:
  keys.json: '[{"id":"key-local","tenant_id":"tenant-local","project_id":"project-local","secret":"xscope-local-secret"}]'
