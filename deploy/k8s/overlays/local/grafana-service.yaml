# Local Docker Desktop entrypoint. Grafana still requires authenticated login.
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: xscope-system }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http, nodePort: 30083 }]
